<div class="modal fade" id="modalCadastroCliente" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content bg-card text-light border-dark-custom">
      <div class="modal-header border-dark-custom">
        <h5 class="modal-header-title font-weight-bold text-gold">🎮 Criar Conta de Cliente</h5>
        <button type="button" class="close text-light" data-dismiss="modal" aria-label="Fechar">&times;</button>
      </div>
      <div class="modal-body p-4">
        <form id="formCadastroCliente" onsubmit="cadastrar_novo_cliente(event)">
          <div class="form-group">
            <label class="small text-muted">Seu Nome / Apelido</label>
            <input type="text" id="clienteNome" class="form-control bg-dark text-light border-dark-custom" placeholder="ex: Player1" required>
          </div>
          <div class="form-group">
            <label class="small text-muted">Seu E-mail (para confirmações de pagamento)</label>
            <input type="email" id="clienteEmail" class="form-control bg-dark text-light border-dark-custom" placeholder="cliente@email.com" required>
          </div>
          <div class="form-group">
            <label class="small text-muted">WhatsApp (para notificações do pedido)</label>
            <input type="tel" id="clienteWhatsapp" class="form-control bg-dark text-light border-dark-custom" placeholder="5511999999999" required>
          </div>
          <button type="submit" class="btn btn-gold btn-block font-weight-bold mt-4">Criar Minha Conta</button>
        </form>
      </div>
    </div>
  </div>
</div>
